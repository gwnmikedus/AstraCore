[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "astracore"
version = "1.0.0"
description = "Astracore: tools for EVE Online capsuleers (v1: AstracorePI)"
requires-python = ">=3.9"
dependencies = [
  "fastapi", "uvicorn", "jinja2", "httpx", "pulp", "python-multipart", "cryptography", "PyJWT",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astracore = ["templates/*.html", "static/**/*", "modules/pi/templates/pi/*.html"]
