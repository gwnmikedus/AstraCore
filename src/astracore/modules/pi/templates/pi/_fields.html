{% macro num(s, name, label, help='', step='any', min=None) -%}
<label>{{ label }}
  {# text + inputmode: native number inputs show the OS locale ("90,0"); the site always shows "90.0" #}
  <input type="text" inputmode="decimal" name="{{ name }}" value="{{ s[name] }}" autocomplete="off"
         pattern="-?[0-9]+([.,][0-9]+)?" {% if min is not none %}data-min="{{ min }}"{% endif %}>
  {% if help %}<small>{{ help }}</small>{% endif %}
</label>
{%- endmacro %}

{% macro check(s, name, label, help='') -%}
<input type="hidden" name="__bool_fields__" value="{{ name }}">
<label><input type="checkbox" role="switch" name="{{ name }}" {% if s[name] %}checked{% endif %}> {{ label }}
  {% if help %}<br><small class="muted">{{ help }}</small>{% endif %}</label>
{%- endmacro %}
