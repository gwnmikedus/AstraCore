{% extends "base.html" %}
{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <h2>{{ {404: 'Not found', 403: 'Not allowed', 500: 'Something broke', 400: 'Bad request', 503: 'EVE isn’t answering'}.get(code, 'Error') }}</h2>
  <p>{{ message }}</p>
  <p>{% if retry %}<a href="{{ retry }}">Try again</a> · {% endif %}<a href="/">Back to the home page</a></p>
</div>
{% endblock %}
