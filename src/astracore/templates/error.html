{% extends "base.html" %}
{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <h2>{{ {404: 'Not found', 403: 'Not allowed', 500: 'Something broke', 400: 'Bad request'}.get(code, 'Error') }}</h2>
  <p>{{ message }}</p>
  <p><a href="/">Back to the home page</a></p>
</div>
{% endblock %}
